let currentFilter = { category: 'all', price: 'all', search: '' };

function renderListings() {
  const container = document.getElementById('listings');
  const filtered = fonts.filter(f => {
    if (currentFilter.category === 'variable' && !f.variable) return false;
    if (currentFilter.category !== 'all' && currentFilter.category !== 'variable' && f.category !== currentFilter.category && !f.tags.includes(currentFilter.category)) return false;
    if (currentFilter.price === 'free' && (f.price > 0 || f.comingSoon)) return false;
    if (currentFilter.price === 'paid' && (f.price === 0 || f.comingSoon)) return false;
    if (currentFilter.search) {
      const q = currentFilter.search.toLowerCase();
      if (!f.name.toLowerCase().includes(q) && !f.tags.some(t => t.toLowerCase() === q) && f.category.toLowerCase() !== q) return false;
    }
    return true;
  });

  if (filtered.length === 0) {
    container.innerHTML = '<div style="padding:24px;color:#888;">no fonts found.</div>';
    return;
  }

  container.innerHTML = filtered.map((f, i) => `
    <div class="listing${f.comingSoon ? ' coming-soon' : ''}" data-index="${fonts.indexOf(f)}"${f.comingSoon ? '' : ` onclick="openDetail(${fonts.indexOf(f)})"`}>
      <div class="listing-top">
        <div class="listing-title">${f.comingSoon ? f.name : `<a href="#" onclick="event.stopPropagation(); openDetail(${fonts.indexOf(f)}); return false;">${f.name}</a>`}</div>
        ${f.comingSoon ? '<div class="listing-soon">coming soon</div>' : (f.draft ? '<div class="listing-draft">draft</div>' : (f.price === 0 ? '<div class="listing-free">free</div>' : '<div class="listing-price">$' + f.price + '</div>'))}
        <div class="listing-meta">${f.date} &middot; ${f.comingSoon ? '? styles' : (f.variable ? 'variable' : f.styles + ' style' + (f.styles > 1 ? 's' : ''))}</div>
      </div>
      <div class="listing-preview${f.karaoke ? ' cdg-preview' : ''}" style="font-family: ${f.family};${f.comingSoon ? ' opacity:0.4;' : ''}">${f.previewText || previewText}</div>
      <div class="listing-tags">
        ${[...f.tags].sort((a, b) => {
          const priority = ['serif', 'sans-serif', 'variable'];
          const ai = priority.indexOf(a), bi = priority.indexOf(b);
          if (ai !== -1 && bi !== -1) return ai - bi;
          if (ai !== -1) return -1;
          if (bi !== -1) return 1;
          return 0;
        }).map(t => `<a href="#" class="tag" onclick="event.stopPropagation(); filterByTag('${t}'); return false;">${t}</a>`).join('')}
      </div>
    </div>
  `).join('');
}

function filterByCategory(cat) {
  currentFilter.category = cat;
  if (cat === 'all') {
    currentFilter.price = 'all';
    updatePriceLinks();
  }
  renderCategories();
  renderListings();
}

function filterByPrice(p) {
  currentFilter.price = p;
  if (p === 'all') {
    currentFilter.category = 'all';
    renderCategories();
  }
  updatePriceLinks();
  renderListings();
}

function filterByTag(tag) {
  currentFilter.search = tag;
  currentFilter.category = 'all';
  currentFilter.price = 'all';
  document.getElementById('searchInput').value = tag;
  renderCategories();
  updatePriceLinks();
  renderListings();
}

function filterFonts() {
  currentFilter.search = document.getElementById('searchInput').value.trim();
  renderListings();
}

function renderCategories() {
  const container = document.getElementById('categories');
  const counts = {};
  fonts.forEach(f => {
    counts[f.category] = (counts[f.category] || 0) + 1;
    f.tags.forEach(t => { if (t !== f.category && t !== 'free') counts[t] = (counts[t] || 0) + 1; });
  });
  const categoryOrder = ['serif', 'sans-serif', 'numeral', 'variable', 'food', 'pixel', 'handwritten', 'fun', 'mashup'];
  const orderedCats = categoryOrder.filter(cat => counts[cat]);
  Object.keys(counts).forEach(cat => { if (!orderedCats.includes(cat)) orderedCats.push(cat); });
  container.innerHTML = '<a href="#" class="' + (currentFilter.category === 'all' ? 'active' : '') + '" onclick="filterByCategory(\'all\'); return false;">all</a>' +
    orderedCats.map(cat =>
      '<a href="#" class="' + (currentFilter.category === cat ? 'active' : '') + '" onclick="filterByCategory(\'' + cat + '\'); return false;">' + cat + ' <span class="count">(' + counts[cat] + ')</span></a>'
    ).join('');
}

function updatePriceLinks() {
  document.querySelectorAll('.filter-links a[data-price]').forEach(a => {
    a.classList.toggle('active', a.dataset.price === currentFilter.price);
  });
}

document.getElementById('searchInput').addEventListener('keydown', (e) => {

});

function initKaraoke(f) {
  const input = document.getElementById('kInput');
  const line = document.getElementById('kline');
  const cursor = document.getElementById('kcursor');
  const hint = document.getElementById('khint');
  const kbox = document.getElementById('kbox');
  const slider = document.getElementById('wipeSlider');
  const wipeVal = document.getElementById('wipeVal');
  const playBtn = document.getElementById('kPlay');
  const NOTES = ["♩", "♪", "♫", "♬"];
  let ni = 1;
  if (window._kTimer) clearInterval(window._kTimer);
  window._kTimer = setInterval(function () { ni = (ni + 1) % NOTES.length; cursor.textContent = NOTES[ni]; }, 480);

  function chars() { return line.querySelectorAll('.kch'); }

  function paint(sung) {
    const c = chars(), n = c.length;
    const b = Math.max(0, Math.min(n, Math.round(sung)));
    for (let i = 0; i < n; i++) c[i].classList.toggle('unsung', i >= b);
    if (b >= n) line.appendChild(cursor);
    else line.insertBefore(cursor, c[b]);
  }

  function scrub() {
    stop();
    const n = chars().length;
    paint(((+slider.value) / 100) * n);
  }

  function words() {
    const v = input.value, w = [];
    let i = 0;
    while (i < v.length) {
      while (i < v.length && v[i] === ' ') i++;
      if (i >= v.length) break;
      const s = i;
      while (i < v.length && v[i] !== ' ') i++;
      w.push([s, i]);
    }
    return w;
  }

  function stop() { if (window._kRaf) { cancelAnimationFrame(window._kRaf); window._kRaf = 0; } playBtn.textContent = "▶ play"; }

  function syllables(word) {
    const m = word.toLowerCase().replace(/[^a-z]/g, '').match(/[aeiouy]+/g);
    return Math.max(1, m ? m.length : 1);
  }

  function play() {
    const w = words(), n = chars().length, v = input.value;
    if (!w.length) return;
    const PER_SYL = 400;
    let dur;
    const segTotal = f.sync ? f.sync.reduce((a, s) => a + s.w, 0) : -1;
    if (f.sync && segTotal === w.length) {
      dur = [];
      let wi = 0;
      for (const s of f.sync) {
        let tot = 0; const syl = [];
        for (let k = 0; k < s.w; k++) { const y = syllables(v.slice(w[wi + k][0], w[wi + k][1])); syl.push(y); tot += y; }
        for (let k = 0; k < s.w; k++) dur.push(s.ms * syl[k] / tot);
        wi += s.w;
      }
    } else {
      dur = w.map(seg => syllables(v.slice(seg[0], seg[1])) * PER_SYL);
    }
    const start = []; let acc = 0;
    for (let i = 0; i < w.length; i++) { start.push(acc); acc += dur[i]; }
    const total = acc, t0 = performance.now();
    playBtn.textContent = "■ stop";
    (function step(now) {
      const t = now - t0;
      if (t >= total) { paint(n); slider.value = 100; wipeVal.textContent = 100; stop(); return; }
      let wi = 0; while (wi < w.length - 1 && t >= start[wi + 1]) wi++;
      const seg = w[wi], frac = Math.min(1, (t - start[wi]) / dur[wi]);
      const sung = seg[0] + frac * (seg[1] - seg[0]);
      paint(sung);
      slider.value = Math.round(sung / n * 100); wipeVal.textContent = slider.value;
      window._kRaf = requestAnimationFrame(step);
    })(t0);
  }

  function sync() {
    stop();
    const v = input.value;
    const old = chars();
    for (let k = 0; k < old.length; k++) old[k].remove();
    for (let i = 0; i < v.length; i++) {
      const s = document.createElement('span');
      s.className = 'kch'; s.textContent = v[i];
      line.insertBefore(s, cursor);
    }
    hint.style.display = v.length ? 'none' : 'block';
    slider.value = 100; wipeVal.textContent = 100;
    paint(v.length);
  }

  slider.addEventListener('input', function () { wipeVal.textContent = slider.value; scrub(); });
  playBtn.addEventListener('click', function () { if (window._kRaf) stop(); else play(); });
  input.addEventListener('input', sync);
  input.addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.stopPropagation(); input.value = ''; sync(); } });
  kbox.addEventListener('mousedown', function (e) { e.preventDefault(); input.focus(); });
  input.value = f.inputDefault || '';
  sync();
  setTimeout(function () { input.focus(); }, 100);
}

      <label>
        <b>Weight</b>
        <input type="range" id="weightSlider" min="${f.weightMin || 100}" max="${f.weightMax || 900}" value="${f.weightDefault || 400}" oninput="
          document.getElementById('varPreview').style.fontWeight = this.value;
          document.getElementById('varPreviewInput').style.fontWeight = this.value;
          document.getElementById('weightVal').textContent = this.value;
        ">
        <span class="val" id="weightVal">${f.weightDefault || 400}</span>
      </label>
    </div>
    ` : ''}
    <div class="detail-info">
      ${f.desc}<br><br>
      <span>Category:</span> ${f.category}<br>
      ${f.variable ? '<span>Type:</span> variable<br><span>Axes:</span> ' + f.axes + '<br>' : '<span>Styles:</span> ' + f.styles + '<br>'}
      <span>License:</span> ${f.license}<br>
      <span>Tags:</span> ${[...f.tags].sort((a, b) => {
          const order = ['serif', 'sans-serif', 'variable', 'food', 'pixel', 'handwritten', 'mashup'];
          const ai = order.indexOf(a), bi = order.indexOf(b);
          if (ai !== -1 && bi !== -1) return ai - bi;
          if (ai !== -1) return -1;
          if (bi !== -1) return 1;
          return 0;
        }).join(', ')}
    </div>
    <div class="buy-section">
      ${f.price === 0
        ? `<a href="${f.buyLink || '#'}" class="buy-btn free"${f.buyLink ? '' : ' onclick="return false;"'}>Download free ↓</a>`
        : `<div class="buy-price">$${f.price}</div><a href="${f.buyLink || '#'}" class="buy-btn"${f.buyLink ? '' : ' onclick="return false;"'}>Buy now →</a>`
      }
    </div>
    ${f.price !== 0 ? `<div style="font-size: 12px; color: #888; margin-top: 8px;">After purchase, I will email you the font files.</div>` : `<div style="font-size: 12px; color: #888; margin-top: 8px;">Click to download the font files directly.</div>`}
    ${f.buyNote ? `<div style="font-size: 12px; color: #888; margin-top: 8px;">${f.buyNote}</div>` : ''}
  `;

  if (f.charset) {
    const inp = document.getElementById('varPreviewInput');
    if (inp) {
      const allowed = f.charset;
      const clean = t => { let o = ''; for (const ch of t) o += allowed.indexOf(ch) >= 0 ? ch : ' '; return o; };
      const isCE = inp.isContentEditable;
      if (isCE) { inp.textContent = clean(inp.textContent); }
      else { inp.value = clean(inp.value); }
      inp.addEventListener('input', () => {
        if (isCE) {
          const sel = window.getSelection(), pos = sel.focusOffset, text = inp.textContent, c = clean(text);
          if (c !== text) {
            inp.textContent = c;
            if (c) { const r = document.createRange(); r.setStart(inp.firstChild, Math.min(pos, c.length)); r.collapse(true); sel.removeAllRanges(); sel.addRange(r); }
          }
        } else {
          const pos = inp.selectionStart, text = inp.value, c = clean(text);
          if (c !== text) { inp.value = c; inp.setSelectionRange(pos, pos); }
        }
      });
    }
  }

  document.getElementById('detailOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  if (window._kTimer) { clearInterval(window._kTimer); window._kTimer = null; }
  if (window._kRaf) { cancelAnimationFrame(window._kRaf); window._kRaf = 0; }
  document.getElementById('detailOverlay').classList.remove('active');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('detailOverlay').classList.contains('active')) {
    closeDetail();
  }
});

renderCategories();
updatePriceLinks();
renderListings();
</script>

</body></html>
